# Each domain module owns its queries and gets its own generated package
# (internal/<module>/store). All modules share the migration schema.
# Regenerate with `make gen`; never edit the generated files by hand.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/user/queries.sql
    gen:
      go:
        package: store
        out: internal/user/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
