name: Feature request
description: Propose a new capability or a change
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Backend, API contract, Web, Mobile, Firmware / reader, Infra]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: If the API contract changes, sketch the new endpoints / fields.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
