# Git hooks (https://lefthook.dev). Install once: `lefthook install`.
# Fast checks only; CI runs the full suite.

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "apps/api/**/*.go"
      run: gofmt -l {staged_files} | (! grep .) || (echo "run gofmt on the files above" && exit 1)
    go-vet:
      glob: "apps/api/**/*.go"
      root: "apps/api/"
      run: go vet ./...
    openapi:
      glob: "api/*.yaml"
      run: npx --yes @redocly/cli@2.83.0 lint api/openapi.yaml

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits, e.g. 'feat(api): add zones'"; exit 1; }
